<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandLens - brand governance before you publish</title>
<style>
:root{--g:#1F6F5C;--y:#F4B942;--bg:#F5F1E8;--ink:#1A1A1A;--mut:#5c5c5c;--card:#fff;--line:#ddd6c6;--red:#b3261e;--amb:#8a5a00}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;margin-right:6px}header a{color:#fff;text-decoration:none;opacity:.92;padding:4px 8px;border-radius:6px}header a:hover,header a.on{background:rgba(255,255,255,.2)}
header .sp{flex:1}.main{max-width:1200px;margin:0 auto;padding:18px}
.ai{background:#fff8e1;border-bottom:1px solid #ecd9a0;padding:6px 20px;font-size:13px;color:#5a4500}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:7px;padding:7px 13px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}button.red{background:var(--red)}button.sm{padding:3px 9px;font-size:13px}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #aaa;border-radius:7px;width:100%;background:#fff}textarea{min-height:150px}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:190px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut);text-transform:uppercase}
tr.click:hover{background:#faf7ef;cursor:pointer}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e8e2d2}
.s-Draft{background:#e8e2d2}.s-In\ Review{background:#dbe9ff;color:#0b3d91}.s-Changes\ Requested{background:#ffe3d6;color:#8a3200}.s-Approved{background:#d6f2dc;color:#0b5b21}
.sev-high{background:#fde0de;color:var(--red)}.sev-medium{background:#fff0cc;color:var(--amb)}.sev-low{background:#e3eef9;color:#1b4f87}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.doc{white-space:pre-wrap;background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:380px;overflow:auto;word-break:break-word}
mark{background:#ffe08a;border-radius:3px;padding:0 1px;cursor:pointer}mark.d{background:#d8eadf}
.f{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:#fff;transition:box-shadow .3s}.f.done{opacity:.8;background:#f7f7f2}
.src{font-size:13px;background:#f1f6f4;border-left:3px solid var(--g);padding:6px 9px;margin:6px 0;color:#244}
.sug{background:#eef7f0;padding:5px 8px;border-radius:6px;margin:6px 0;font-size:14px}del{background:#fde0de}ins{background:#d6f2dc;text-decoration:none}
.mut{color:var(--mut);font-size:13px}.bar{height:12px;background:var(--g);border-radius:4px;min-width:3px;display:inline-block;vertical-align:middle}
.login{max-width:520px;margin:24px auto}dialog{border:0;border-radius:12px;padding:18px;width:min(580px,92vw)}dialog::backdrop{background:rgba(0,0,0,.4)}
.err{background:#fde0de;color:var(--red);padding:8px 12px;border-radius:8px;margin-bottom:10px}.ok{background:#d6f2dc;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.warn{background:#fff0cc;padding:2px 8px;border-radius:6px;font-size:12px}.box{background:#fff0cc;padding:10px;border-radius:8px;margin-bottom:8px}
.imgwrap{position:relative;display:inline-block;max-width:100%}.imgwrap img{max-width:100%;max-height:420px;display:block;border:1px solid var(--line);border-radius:6px}.imgwrap .bb{position:absolute;border:3px solid #d81b60;border-radius:3px}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #888;vertical-align:middle;margin-right:4px}
.cred{width:100%;font-size:13px}.cred td{padding:3px 6px}.spin{padding:30px;text-align:center;color:var(--mut)}
.steps{display:flex;gap:10px;flex-wrap:wrap}.steps div{flex:1;min-width:170px;background:#f1f6f4;border-radius:8px;padding:8px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style></head><body>
<header id="hd"></header><div class="ai" id="ai"></div><div class="main" id="app"><div class="spin">Loading... (the free server can take up to a minute to wake up)</div></div>
<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><div id="db"></div><div style="margin-top:12px;text-align:right"><button class="alt" id="dno" type="button">Cancel</button> <button id="dyes">OK</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={token:localStorage.getItem('bl_token'),user:null,disc:null};let CUR=null,NEW={img:null};
async function api(path,opt={}){const h={};if(S.token)h.Authorization='Bearer '+S.token;if(!opt.form&&opt.body)h['Content-Type']='application/json';
 let r;try{r=await fetch('/api'+path,{method:opt.method||'GET',headers:h,body:opt.form?opt.form:(opt.body?JSON.stringify(opt.body):undefined)})}catch(e){throw new Error('Cannot reach the server. Check your connection and try again.')}
 if(opt.raw){if(!r.ok)throw new Error('Could not load');return r}
 if(r.status===401&&path!=='/login'){S.token=null;S.user=null;localStorage.removeItem('bl_token');location.hash='#/login';render();throw new Error('Your session expired. Please log in again.')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Please check your input and try again.');return j}
function ask(title,html,get){return new Promise(res=>{$('#dt').textContent=title;$('#db').innerHTML=html;const d=$('#dlg');$('#dno').onclick=()=>{d.close();res(null)};$('#dyes').onclick=e=>{e.preventDefault();const v=get();d.close();res(v)};d.onclose=()=>{};d.showModal();const f=d.querySelector('input,textarea');f&&f.focus()})}
function toast(m,bad){const t=$('#toast');if(t){t.innerHTML=`<div class="${bad?'err':'ok'}" role="alert">${esc(m)}</div>`;t.scrollIntoView({block:'nearest'});setTimeout(()=>{const x=$('#toast');if(x)x.innerHTML=''},6000)}else if(bad)alert(m)}
async function busy(btn,fn){if(btn&&btn.disabled)return;if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message,1)}finally{if(btn)btn.disabled=false}}
function logout(){api('/me').catch(()=>{});localStorage.removeItem('bl_token');S.token=null;S.user=null;location.hash='#/login';render()}
async function boot(){try{S.disc=await api('/disclosure');$('#ai').innerHTML=(S.disc.ai_enabled?`AI disclosure: rule-based checks plus an external AI service (${esc(S.disc.model)}); AI findings are labelled and must pass citation verification. ${S.disc.redaction?'Personal data (emails, phone numbers, ID numbers) is redacted before any text is sent.':''}`:'AI disclosure: this deployment uses transparent rule-based checks only. An optional AI layer (external LLM API) is off; if enabled, AI findings are labelled, citation-verified and personal data is redacted before sending.')+` Storage: ${esc(S.disc.database)}.`}catch(e){}
 if(S.token){try{S.user=await api('/me')}catch(e){S.token=null}}render()}
window.onhashchange=render;
function nav(){const u=S.user;if(!u){$('#hd').innerHTML='<b>BrandLens</b>';return}const h=location.hash;const a=(p,t)=>`<a href="#${p}" class="${h===('#'+p)?'on':''}">${t}</a>`;
 $('#hd').innerHTML=`<b>BrandLens</b>${a('/','Submissions')}${a('/new','New review')}${a('/kb','Brand knowledge')}${u.role!=='creator'?a('/insights','Insights'):''}${a('/quality','Quality')}<span class="sp"></span><span>${esc(u.workspace)} &middot; ${esc(u.name)} <span class="chip" style="color:#000">${esc(u.role)}</span></span><button class="alt sm" onclick="logout()">Log out</button>`}
async function render(){nav();const h=location.hash||'#/';const el=$('#app');
 try{if(!S.user)return viewLogin(el);if(h==='#/login'){location.hash='#/';return}
 if(h==='#/'||h==='')return await viewList(el);if(h==='#/new')return viewNew(el);if(h==='#/kb')return await viewKB(el);if(h==='#/insights')return await viewInsights(el);if(h==='#/quality')return await viewQuality(el);
 const m=h.match(/^#\/s\/(\d+)(?:\/v(\d+))?/);if(m)return await viewSub(el,+m[1],m[2]?+m[2]:null);el.innerHTML='<div class="card">Page not found. <a href="#/">Go to submissions</a></div>'}
 catch(e){el.innerHTML=`<div class="err">${esc(e.message)} <a href="#/">Back to submissions</a></div>`}}
function viewLogin(el){el.innerHTML=`<div class="card login"><h2>BrandLens</h2><p>Check content against approved brand guidelines <b>before</b> it is published. Pick a demo role to try the full workflow:</p>
 <p class="mut" style="margin:0">Demo brand <b>BrightBox</b>:</p><div class="row" style="margin:6px 0 10px"><button onclick="doLogin('riya',this)">Creator (Riya)</button><button onclick="doLogin('manav',this)">Brand manager (Manav)</button><button onclick="doLogin('sana',this)">Reviewer (Sana)</button></div>
 <p class="mut" style="margin:0">Second demo workspace <b>Northwind Bank</b> (separate data, to see workspace isolation):</p><div class="row" style="margin:6px 0 10px"><button class="alt" onclick="doLogin('nora',this)">Manager (Nora)</button><button class="alt" onclick="doLogin('nikhil',this)">Creator (Nikhil)</button></div>
 <table class="cred"><tr><th>Username</th><th>Role</th><th>Workspace</th></tr><tr><td>riya</td><td>creator</td><td>BrightBox</td></tr><tr><td>manav</td><td>manager</td><td>BrightBox</td></tr><tr><td>sana</td><td>reviewer</td><td>BrightBox</td></tr><tr><td>nora</td><td>manager</td><td>Northwind Bank</td></tr><tr><td>nikhil</td><td>creator</td><td>Northwind Bank</td></tr></table><p class="mut">Password for every demo user: <code>demo123</code></p>
 <details><summary>Log in manually</summary><label for="lu">Username</label><input id="lu" value="riya" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" value="demo123" autocomplete="current-password"><p><button onclick="doLogin(null,this)">Log in</button></p></details>
 <details style="margin-top:8px"><summary>Create your own workspace (you become its manager)</summary><label for="wn">Brand / company name</label><input id="wn" maxlength="60"><label for="wf">Your name</label><input id="wf" maxlength="60"><label for="wu">Username (letters, numbers, . _ -)</label><input id="wu" maxlength="30"><label for="wp">Password (6+ characters)</label><input id="wp" type="password"><p><button onclick="doRegister(this)">Create workspace</button></p></details><div id="toast"></div></div>`}
async function doLogin(u,btn){return busy(btn,async()=>{const r=await api('/login',{method:'POST',body:{username:u||$('#lu').value,password:u?'demo123':$('#lp').value}});S.token=r.token;S.user=r.user;localStorage.setItem('bl_token',r.token);location.hash='#/';render()})}
async function doRegister(btn){return busy(btn,async()=>{const r=await api('/workspaces',{method:'POST',body:{workspace:$('#wn').value,name:$('#wf').value,username:$('#wu').value,password:$('#wp').value}});S.token=r.token;S.user=r.user;localStorage.setItem('bl_token',r.token);location.hash='#/kb';render()})}
const chip=s=>`<span class="chip s-${esc(s)}">${esc(s)}</span>`;
async function viewList(el){const r=await api('/submissions');const first=!r.length;
 el.innerHTML=`<div id="toast"></div>${S.user.role==='creator'||first?`<div class="card"><h3>How it works</h3><div class="steps"><div><b>1. Submit</b><br>Paste text or upload a file or image, and say what it should achieve.</div><div><b>2. Review</b><br>Get explained findings that cite the approved guideline or fact.</div><div><b>3. Decide</b><br>Accept, edit or dismiss each suggestion. Nothing changes without you.</div><div><b>4. Approve</b><br>Send it to a manager or reviewer for the final decision.</div></div></div>`:''}
 <div class="card"><div class="row" style="align-items:center"><h2 style="flex:3">${S.user.role==='creator'?'My content':'All content in '+esc(S.user.workspace)}</h2><div style="text-align:right"><a class="btn" href="#/new">+ New review</a></div></div>
 <table><tr><th>Title</th><th>Channel</th><th>Author</th><th>Status</th><th>Version</th><th>Findings</th></tr>${r.map(s=>`<tr class="click" onclick="location.hash='#/s/${s.id}'"><td><b>${esc(s.title)}</b><div class="mut">${esc(s.purpose)}</div></td><td>${esc(s.channel)}</td><td>${esc(s.author)}</td><td>${chip(s.status)}</td><td>v${s.version}</td><td>${s.open_findings} open / ${s.total_findings}</td></tr>`).join('')||'<tr><td colspan=6>Nothing here yet. Click <b>+ New review</b> and try &ldquo;Load sample content&rdquo;.</td></tr>'}</table></div>`}
const SAMPLE={t:'Instagram: Summer Offer',p:'Promote the annual plan to new followers',c:'Social media',x:'Hey guys!! Summer is HERE \u2600\ufe0f Our annual plan saves 25% and we guarantee you will love it. The Starter box costs just \u20b9549 a month. Join the Bright Box family today! Call 9876543210.',col:'text: #FFFFFF, background: #F4B942'};
function viewNew(el){NEW={img:null};el.innerHTML=`<div class="card"><h2>New review</h2><div id="toast"></div><div class="row"><div><label for="nt">Title</label><input id="nt" maxlength="200" placeholder="e.g. Instagram: Diwali box"></div><div><label for="nc">Channel</label><select id="nc"><option>Social media</option><option>Email</option><option selected>Website</option><option>Press release</option><option>Brochure</option></select></div></div>
 <label for="np">Purpose (what should this achieve? Suggestions try to preserve it)</label><input id="np" maxlength="300" placeholder="e.g. Announce the festive box to existing members">
 <label for="nx">Text (paste, or upload .txt / .docx / .pdf below). Leave empty if you only want to review an image.</label><textarea id="nx" maxlength="20000" placeholder="Paste your draft here. Markdown images and links are checked for accessibility."></textarea>
 <div class="row"><div><input type="file" id="nf" accept=".txt,.md,.docx,.pdf" aria-label="Upload a text document"></div><div><label for="ncol" style="margin-top:0">Design colours (optional: text colour then background colour, hex)</label><input id="ncol" maxlength="200" placeholder="text: #777777, background: #FFFFFF"></div></div>
 <h3 style="margin-top:14px">Image or design (optional)</h3><div class="row"><div><input type="file" id="ni" accept="image/png,image/jpeg,image/webp" aria-label="Upload an image or design"><p class="mut">PNG or JPG, up to 5 MB. Checked for palette, logo size and clear space, resolution, aspect ratio and alt text.</p></div>
 <div><label for="nk" style="margin-top:0">This image is a</label><select id="nk"><option value="design">Design / graphic (palette and logo checked)</option><option value="photo">Photograph (palette and logo not checked)</option></select></div></div>
 <label for="na">Alt text for the image (describe what it shows)</label><input id="na" maxlength="300" placeholder="e.g. A box of healthy snacks on a rainy window sill"><div id="prev" style="margin-top:6px"></div>
 <p><button onclick="submitNew(this)" id="nb">Run review</button> <button class="alt" onclick="fillSample()">Load sample content</button> <button class="alt" onclick="useSample('good')">Use on-brand sample image</button> <button class="alt" onclick="useSample('bad')">Use off-brand sample image</button> <button class="alt" onclick="privPreview(this)">Preview privacy redaction</button></p><div id="priv"></div></div>`;
 $('#nf').onchange=e=>busy(null,async()=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await api('/extract',{method:'POST',form:fd});$('#nx').value=r.text;if(!$('#nt').value)$('#nt').value=f.name.replace(/\.[^.]+$/,'');toast('Text extracted from '+r.filename+(r.truncated?' (first 20,000 characters)':''))});
 $('#ni').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){toast('That image is larger than 5 MB',1);e.target.value='';return}const rd=new FileReader();rd.onload=()=>setImg(rd.result);rd.readAsDataURL(f)}}
function setImg(url){NEW.img=url;$('#prev').innerHTML=url?`<img src="${url}" alt="Preview of the selected image" style="max-height:160px;border:1px solid #ccc;border-radius:6px"> <button class="alt sm" onclick="setImg(null)">Remove image</button>`:''}
function fillSample(){$('#nt').value=SAMPLE.t;$('#np').value=SAMPLE.p;$('#nc').value=SAMPLE.c;$('#nx').value=SAMPLE.x;$('#ncol').value=SAMPLE.col}
async function useSample(k){return busy(null,async()=>{const r=await api('/samples/image/'+k,{raw:1});const b=await r.blob();const rd=new FileReader();rd.onload=()=>{setImg(rd.result);if(!$('#nt').value)$('#nt').value=k==='good'?'Poster: Monsoon Box (sample)':'Poster: Monsoon Sale (sample)';if(!$('#np').value)$('#np').value='Promote the monsoon offer';if(k==='bad')$('#nc').value='Social media';if(k==='good')$('#na').value='A promotional poster for the BrightBox monsoon snack box'};rd.readAsDataURL(b)})}
async function privPreview(btn){return busy(btn,async()=>{const r=await api('/privacy-preview',{method:'POST',body:{text:$('#nx').value}});$('#priv').innerHTML=`<div class="box"><b>What an external AI service would receive</b> (only if an administrator enables it): ${r.found.length?r.found.length+' personal item(s) replaced by placeholders.':'no personal data found.'}<div class="doc" style="margin-top:6px;max-height:160px">${esc(r.redacted)}</div></div>`})}
async function submitNew(btn){return busy(btn,async()=>{btn.textContent='Reviewing...';try{const r=await api('/submissions',{method:'POST',body:{title:$('#nt').value,purpose:$('#np').value,channel:$('#nc').value,text:$('#nx').value,colors:$('#ncol').value,image_b64:NEW.img,image_kind:$('#nk').value,image_alt:$('#na').value}});location.hash='#/s/'+r.id}finally{btn.textContent='Run review'}})}
function hiliteText(text,fs){const ok=fs.filter(f=>f.start>=0).sort((a,b)=>a.start-b.start);let out='',pos=0;for(const f of ok){if(f.start<pos)continue;out+=esc(text.slice(pos,f.start))+`<mark class="${f.status==='open'?'':'d'}" onclick="focusF(${f.id})" title="${esc(f.category)}">${esc(text.slice(f.start,f.end)||'\u2423')}</mark>`;pos=f.end}return out+esc(text.slice(pos))}
function focusF(id){const e=document.getElementById('f'+id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.style.boxShadow='0 0 0 3px #F4B942';setTimeout(()=>e.style.boxShadow='',1500)}}
function findingCard(f,canAct){const done=f.status!=='open';const st={accepted:'Accepted',edited:'Edited by you',dismissed:'Dismissed'}[f.status];const m=f.meta||{};
 let sg;if(f.start>=0){sg=f.suggestion?`<div class="sug"><b>Suggested:</b> <del>${esc(f.original)||'\u2423'}</del> &rarr; <ins>${esc(f.suggestion)}</ins></div>`:(f.rule==='longsent'?'<div class="sug mut">No automatic suggestion: this needs your own wording (human judgement).</div>':`<div class="sug"><b>Suggested:</b> remove <del>${esc(f.original)}</del></div>`)}
 else sg=`<div class="sug"><b>Suggestion:</b> ${esc(f.suggestion||'Review your design')} <span class="mut">(applies to the design, not the text; accepting means you will fix it in the design file)</span></div>`;
 const sw=(m.colors||[]).map(c=>`<span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)} (${c.share}%)`).join(' &nbsp; ');
 return `<div class="f ${done?'done':''}" id="f${f.id}"><div><span class="chip sev-${f.severity}">${f.severity}</span> <span class="chip">${esc(f.category)}</span> ${f.origin==='ai'?'<span class="chip" style="background:#efe3ff">AI finding (verified)</span>':'<span class="chip">Rule check</span>'} <span class="mut" title="Calibrated from ${m.eval_precision!=null?'evaluation precision '+Math.round(m.eval_precision*100)+'%':'the raw score'} and ${(m.human_accepted||0)+(m.human_dismissed||0)} human decisions in this workspace">confidence ${Math.round(f.confidence*100)}%</span>${f.confidence<0.7||f.rule==='longsent'?' <span class="warn">needs human judgement</span>':''}</div>
 <p style="margin:6px 0"><b>${esc(f.explanation)}</b></p>${f.original?`<div class="mut">Found: &ldquo;${esc(f.original)}&rdquo;</div>`:''}${sw?`<div class="mut" style="margin:4px 0">${sw}</div>`:''}
 <div class="src"><b>Why: ${esc(f.source_ref)} &middot; ${esc(f.source_title)}</b><br>${esc(f.source_text)}</div>${sg}
 ${done?`<div><span class="chip">${st}</span> ${f.status==='edited'?'&rarr; '+esc(f.decision_text):''} ${f.reason?'<span class="mut">Reason: '+esc(f.reason)+'</span>':''} ${canAct?`<button class="alt sm" onclick="decide(${f.id},'reopen',null,this)">Undo</button>`:''}</div>`:
 (canAct?`<div><button class="sm" onclick="decide(${f.id},'accept',null,this)" ${f.rule==='longsent'?'disabled title="No suggestion to accept. Use Edit or Dismiss"':''}>Accept</button> <button class="alt sm" onclick="decideEdit(${f.id},this)">Edit</button> <button class="alt sm" onclick="decideDismiss(${f.id})">Dismiss</button></div>`:'<span class="mut">Waiting for the author&rsquo;s decision</span>')}</div>`}
async function viewSub(el,id,ver){const d=await api('/submissions/'+id+(ver?'?version='+ver:''));CUR=d;const s=d.submission,v=d.version,u=S.user;const latest=v.n===d.latest;const own=s.author_id===u.id;const locked=['Approved','In Review'].includes(s.status);const canAct=own&&latest&&!locked;
 const open=d.findings.filter(f=>f.status==='open').length;
 let actions='';if(own&&latest){if(['Draft','Changes Requested'].includes(s.status))actions+=`<button onclick="doSubmit(this)">Submit for review</button> `;if(!locked)actions+=`<button class="alt" onclick="doApply(this)">Apply my accepted changes as a new version</button> `;if(s.status!=='In Review')actions+=`<button class="alt" onclick="doEdit()">Edit text and re-review</button>`}
 if(['manager','reviewer'].includes(u.role)&&!own&&s.status==='In Review')actions+=`<button onclick="doDecision('approve')">Approve</button> <button class="red" onclick="doDecision('request_changes')">Request changes</button>`;
 const bbs=d.findings.filter(f=>f.meta&&f.meta.bbox).map(f=>`<div class="bb" style="left:${f.meta.bbox.x*100}%;top:${f.meta.bbox.y*100}%;width:${f.meta.bbox.w*100}%;height:${f.meta.bbox.h*100}%" title="${esc(f.source_ref)}"></div>`).join('');
 el.innerHTML=`<div id="toast"></div><div class="card"><div class="row" style="align-items:center"><div style="flex:3"><h2 style="margin:0">${esc(s.title)} ${chip(s.status)}</h2><div class="mut">${esc(s.channel)} &middot; by ${esc(s.author)} &middot; Purpose: ${esc(s.purpose)||'(not stated)'}</div></div>
  <div><label for="vsel" style="margin:0">Version</label><select id="vsel" onchange="location.hash='#/s/${id}/v'+this.value">${d.versions.map(x=>`<option value="${x.n}" ${x.n===v.n?'selected':''}>v${x.n} - ${esc(x.note)}</option>`).join('')}</select></div></div>
  ${!latest?`<p class="warn">You are viewing an older version (read only). <a href="#/s/${id}">Go to latest</a></p>`:''}${locked&&own?`<p class="mut">${s.status==='In Review'?'This content is with a reviewer, so it is read only.':'Approved content is locked. Edit the text to start a new version.'}</p>`:''}<p style="margin:10px 0 0">${actions}</p>
  <p class="mut">Review of v${v.n}: ${open} open, ${d.findings.length} total. ${esc(v.ai_status||'')}</p></div>
 <div class="grid"><div>${v.has_image?`<div class="card"><h3>Image (${esc(v.image_kind||'design')})</h3><div class="imgwrap"><img id="himg" alt="${esc(v.image_alt||'Submitted image (no alt text provided)')}">${bbs}</div><p class="mut">Alt text: ${esc(v.image_alt)||'(none)'}. Pink boxes show where the logo was detected.</p></div>`:''}
 ${v.text.trim()?`<div class="card"><h3>Text (v${v.n})</h3><div class="doc">${hiliteText(v.text,d.findings)}</div>${v.colors?`<p class="mut">Design colours: ${esc(v.colors)}</p>`:''}<p class="mut">Highlighted text is flagged. Click it to jump to the explanation.</p></div>`:''}
 <div class="card"><h3>Comments</h3>${d.comments.map(c=>`<div style="margin-bottom:8px"><b>${esc(c.name)}</b> <span class="chip">${esc(c.role)}</span> <span class="mut">${esc(c.created_at)}</span><div>${esc(c.body)}</div></div>`).join('')||'<p class="mut">No comments yet.</p>'}
 <div class="row"><input id="cm" maxlength="2000" placeholder="Add a comment" aria-label="Add a comment"><button style="flex:0" onclick="addComment(this)">Post</button></div></div>
 <div class="card"><h3>History and audit log</h3><button class="alt sm" onclick="showDiff()">Compare with previous version</button><div id="diff"></div><table>${d.audit.map(a=>`<tr><td class="mut" style="width:130px">${esc(a.created_at)}</td><td><b>${esc(a.name||'system')}</b> ${esc(a.action)}<div class="mut">${esc(a.detail)}</div></td></tr>`).join('')}</table></div></div>
 <div><h3>Findings (${d.findings.length})</h3>${d.findings.map(f=>findingCard(f,canAct)).join('')||'<div class="card ok">No issues found against the approved guidelines.</div>'}<p class="mut">Rules and AI only suggest. Nothing changes until you accept, edit or dismiss it, and a human approves the final content.</p></div></div>`;
 if(v.has_image)loadImg(id,v.n)}
async function loadImg(id,n){try{const r=await api(`/submissions/${id}/image?version=${n}`,{raw:1});const b=await r.blob();const i=$('#himg');if(i)i.src=URL.createObjectURL(b)}catch(e){}}
async function decide(id,dec,x,btn){return busy(btn,async()=>{await api('/findings/'+id+'/decide',{method:'POST',body:{decision:dec,...(x||{})}});await render()})}
async function decideEdit(id,btn){const f=CUR.findings.find(x=>x.id===id);const v=await ask('Your replacement text','<input id="ev" maxlength="2000" aria-label="Replacement text" value="'+esc(f.suggestion||'')+'">',()=>$('#ev').value);if(v===null)return;decide(id,'edit',{edited_text:v},btn)}
async function decideDismiss(id){const v=await ask('Why are you dismissing this finding?','<input id="ev" maxlength="500" placeholder="Short reason (kept in the audit log)" aria-label="Reason">',()=>$('#ev').value);if(v===null)return;decide(id,'dismiss',{reason:v})}
async function doApply(btn){return busy(btn,async()=>{const r=await api('/submissions/'+CUR.submission.id+'/apply',{method:'POST'});location.hash='#/s/'+CUR.submission.id;await render();toast('Created v'+r.version+' with '+r.applied+' change(s) and re-ran the review')})}
async function doEdit(){const v=await ask('Edit text (a new version is created and re-reviewed)','<textarea id="ev" maxlength="20000" style="min-height:220px">'+esc(CUR.version.text)+'</textarea>',()=>$('#ev').value);if(v===null)return;busy(null,async()=>{await api('/submissions/'+CUR.submission.id+'/version',{method:'POST',body:{text:v,colors:CUR.version.colors||'',note:'Edited by author'}});location.hash='#/s/'+CUR.submission.id;await render();toast('New version created and re-reviewed')})}
async function doSubmit(btn){return busy(btn,async()=>{await api('/submissions/'+CUR.submission.id+'/status',{method:'POST',body:{action:'submit'}});await render()})}
async function doDecision(a){const c=await ask(a==='approve'?'Approve this content':'Request changes','<input id="ev" maxlength="2000" placeholder="'+(a==='approve'?'Optional comment':'What must change? (required)')+'" aria-label="Comment">',()=>$('#ev').value);if(c===null)return;busy(null,async()=>{await api('/submissions/'+CUR.submission.id+'/status',{method:'POST',body:{action:a,comment:c}});await render()})}
async function addComment(btn){return busy(btn,async()=>{await api('/submissions/'+CUR.submission.id+'/comments',{method:'POST',body:{body:$('#cm').value}});await render()})}
async function showDiff(){const n=CUR.version.n;if(n<2){$('#diff').innerHTML='<p class="mut">This is the first version.</p>';return}const r=await api(`/submissions/${CUR.submission.id}/diff?a=${n-1}&b=${n}`);$('#diff').innerHTML='<div class="doc" style="max-height:220px;margin:8px 0">'+r.ops.map(o=>o.op==='equal'?esc(o.text):o.op==='delete'?'<del>'+esc(o.text)+'</del>':'<ins>'+esc(o.text)+'</ins>').join('')+'</div>'}
async function viewKB(el){const [k,us]=await Promise.all([api('/kb'),api('/users')]);const mgr=S.user.role==='manager';const rm=(t,i)=>mgr?`<button class="alt sm" onclick="rmKB('${t}','${esc(i)}',this)">Remove</button>`:'';
 const pal=(k.clauses.find(c=>c.check_type==='palette')||{params:'{}'});const colors=(JSON.parse(pal.params||'{}').colors)||[];
 el.innerHTML=`<div id="toast"></div><div class="card"><h2>Brand knowledge: ${esc(S.user.workspace)}</h2><p class="mut">The approved source material every finding is checked against and cites. ${mgr?'You can edit it.':'Only a brand manager can edit it.'}</p></div>
 <div class="card"><h3>Guidelines</h3><table><tr><th>Ref</th><th>Category</th><th>Rule</th><th>Type</th><th></th></tr>${k.clauses.map(c=>{const p=JSON.parse(c.params||'{}');return `<tr><td>${esc(c.ref)}</td><td>${esc(c.category)}</td><td><b>${esc(c.title)}</b><div class="mut">${esc(c.text)}</div>${p.exempt_channels?`<div class="warn">Exception: not applied on ${esc(p.exempt_channels.join(', '))}</div>`:''}</td><td>${c.check_type==='text'?'<span class="mut">Reference text (used by AI layer)</span>':'<span class="chip">Automatic check</span>'}</td><td>${c.check_type==='text'?rm('clause',c.ref):''}</td></tr>`}).join('')}</table>
 ${mgr?`<label for="imp">Import guidelines (paste text; each paragraph becomes a reference clause) or upload a file</label><textarea id="imp" style="min-height:80px" maxlength="40000"></textarea><p><input type="file" id="impf" accept=".txt,.md,.docx,.pdf" style="width:auto"> <button onclick="doImport(this)">Import</button></p>`:''}</div>
 <div class="card"><h3>Brand colours and logo</h3><p>${colors.map(c=>`<span class="sw" style="background:${esc(c)}"></span>${esc(c)} &nbsp;`).join('')||'<span class="mut">No palette set yet, so palette checks are off.</span>'}</p>
 ${mgr?`<label for="pal">Palette (six-digit hex codes, comma separated)</label><div class="row"><input id="pal" value="${esc(colors.join(', '))}"><button style="flex:0" onclick="savePal(this)">Save palette</button></div>`:''}
 <p style="margin-top:12px"><b>Approved logo:</b> ${k.has_logo?'<img id="logoimg" alt="Approved brand logo" style="height:56px;vertical-align:middle;border:1px solid #ccc;border-radius:6px">':'<span class="mut">none uploaded, so logo checks are off.</span>'}</p>
 ${mgr?`<input type="file" id="logof" accept="image/png,image/jpeg" style="width:auto" aria-label="Upload approved logo"> <button onclick="saveLogo(this)">Upload logo</button> <span class="mut">Use a flat, opaque logo image.</span>`:''}</div>
 <div class="card"><h3>Terminology</h3><table><tr><th>Avoid</th><th>Use</th><th></th></tr>${k.terms.map(t=>`<tr><td>${esc(t.banned)}</td><td>${esc(t.preferred)}</td><td>${rm('term',t.id)}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">No terms yet.</td></tr>'}</table>
 ${mgr?`<div class="row"><input id="tb" maxlength="80" placeholder="Term to avoid" aria-label="Term to avoid"><input id="tp" maxlength="80" placeholder="Approved term" aria-label="Approved term"><button style="flex:0" onclick="addTerm(this)">Add</button></div>`:''}</div>
 <div class="card"><h3>Approved facts and claims</h3><table><tr><th>Ref</th><th>What</th><th>Approved value</th><th>Source</th><th></th></tr>${k.facts.map(f=>`<tr><td>${esc(f.ref)}</td><td>${esc(f.label)}<div class="mut">${f.kind==='claim'?'approved claim':'keywords: '+esc(JSON.parse(f.keywords||'[]').join(', '))}</div></td><td>${esc(f.value)}</td><td>${esc(f.source)}</td><td>${rm('fact',f.id)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">No facts yet.</td></tr>'}</table>
 ${mgr?`<div class="row"><input id="fl" maxlength="100" placeholder="Label e.g. Premium box price" aria-label="Label"><input id="fk" maxlength="200" placeholder="Keywords (comma separated)" aria-label="Keywords"><input id="fv" maxlength="100" placeholder="Approved value e.g. \u20b9899" aria-label="Value"><input id="fs" maxlength="150" placeholder="Source document" aria-label="Source"><select id="fy" aria-label="Type"><option value="fact">Fact (number check)</option><option value="claim">Approved claim</option></select><button style="flex:0" onclick="addFact(this)">Add</button></div>`:''}</div>
 <div class="card"><h3>Team in this workspace</h3><table><tr><th>Name</th><th>Username</th><th>Role</th></tr>${us.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td></tr>`).join('')}</table>
 ${mgr?`<div class="row"><input id="un" maxlength="60" placeholder="Full name" aria-label="Full name"><input id="uu" maxlength="30" placeholder="Username" aria-label="Username"><input id="up" type="password" placeholder="Password (6+)" aria-label="Password"><select id="ur" aria-label="Role"><option value="creator">creator</option><option value="reviewer">reviewer</option><option value="manager">manager</option></select><button style="flex:0" onclick="addUser(this)">Add</button></div>`:''}</div>`;
 const f=$('#impf');if(f)f.onchange=e=>busy(null,async()=>{const fd=new FormData();fd.append('file',e.target.files[0]);$('#imp').value=(await api('/extract',{method:'POST',form:fd})).text});
 if(k.has_logo)api('/kb/logo',{raw:1}).then(r=>r.blob()).then(b=>{const i=$('#logoimg');if(i)i.src=URL.createObjectURL(b)}).catch(()=>{})}
async function rmKB(t,i,b){if(!confirm('Remove this item? This cannot be undone.'))return;return busy(b,async()=>{await api(`/kb/${t}/${encodeURIComponent(i)}`,{method:'DELETE'});await render()})}
async function addTerm(b){return busy(b,async()=>{await api('/kb/term',{method:'POST',body:{banned:$('#tb').value,preferred:$('#tp').value}});await render()})}
async function addFact(b){return busy(b,async()=>{await api('/kb/fact',{method:'POST',body:{label:$('#fl').value,keywords:$('#fk').value,value:$('#fv').value,source:$('#fs').value,kind:$('#fy').value}});await render()})}
async function doImport(b){return busy(b,async()=>{const r=await api('/kb/import',{method:'POST',body:{text:$('#imp').value}});await render();toast('Imported '+r.imported+' clause(s)')})}
async function savePal(b){return busy(b,async()=>{const cols=$('#pal').value.split(',').map(x=>x.trim()).filter(Boolean);await api('/kb/palette',{method:'PUT',body:{colors:cols}});await render();toast('Palette saved')})}
async function saveLogo(b){return busy(b,async()=>{const f=$('#logof').files[0];if(!f)throw new Error('Choose a logo image first');const rd=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});await api('/kb/logo',{method:'POST',body:{image_b64:rd}});await render();toast('Logo updated')})}
async function addUser(b){return busy(b,async()=>{await api('/users',{method:'POST',body:{name:$('#un').value,username:$('#uu').value,password:$('#up').value,role:$('#ur').value}});await render();toast('User added')})}
async function applyProp(i,b){const p=window.PROPS[i];return busy(b,async()=>{await api('/proposals/apply',{method:'POST',body:{ref:p.ref,exempt_channels:p.channels,new_text:p.new_text||'',reason:'Guideline Health proposal: '+p.evidence}});await render();toast('Guideline updated. New reviews use the change immediately.')})}
async function viewInsights(el){const d=await api('/insights');window.PROPS=d.proposals;const mgr=S.user.role==='manager';const mx=Math.max(1,...d.rules.map(r=>r.total));const tmax=Math.max(1,...d.trend.map(t=>t.n));
 el.innerHTML=`<div id="toast"></div><div class="card"><h2>Guideline health</h2><p class="mut">What authors repeatedly get wrong, and where the guidelines themselves may be the problem.</p>
 <h3>Proposed guideline changes</h3>${d.proposals.map((p,i)=>`<div class="box"><b>${esc(p.ref)} &middot; ${esc(p.title)}</b> <span class="chip">${p.kind==='channel_exception'?'Context-dependent rule':'Possibly unclear wording'}</span><p style="margin:6px 0">${esc(p.evidence)}${p.reasons.length?' Reasons given: &ldquo;'+p.reasons.map(esc).join('&rdquo;, &ldquo;')+'&rdquo;.':''}</p><p class="mut" style="margin:4px 0">${esc(p.explain)}</p>${p.new_text?`<div class="sug"><b>Current:</b> ${esc(p.old_text)}<br><b>Proposed:</b> <ins>${esc(p.new_text)}</ins><br><span class="mut">Also: rule not applied on ${esc(p.channels.join(', '))}.</span></div>`:''}${p.kind==='channel_exception'&&mgr?`<button onclick="applyProp(${i},this)">Apply this change</button>`:(p.kind==='channel_exception'?'<span class="mut">A manager can apply this.</span>':'')}</div>`).join('')||'<p class="mut">No proposals right now. Proposals appear once authors have decided on several findings for a rule.</p>'}
 <h3 style="margin-top:14px">Conflicts and gaps inside the guidelines</h3>${d.conflicts.map(c=>`<div class="box"><b>${esc(c.refs.join(' / '))}</b> ${esc(c.detail)}</div>`).join('')||'<p class="mut">No conflicts detected.</p>'}${d.unused.length?`<p class="mut">Rules that never fired (possibly obsolete): ${d.unused.map(u=>esc(u.ref)).join(', ')}</p>`:''}</div>
 <div class="card"><h3>Most repeated issues</h3><table><tr><th>Rule</th><th>Category</th><th style="width:24%">Findings</th><th>Accepted</th><th>Dismissed</th><th>Open</th><th>By channel (accepted / dismissed)</th></tr>${d.rules.map(r=>`<tr><td><b>${esc(r.ref)}</b><div class="mut">${esc(r.title)}</div></td><td>${esc(r.category)}</td><td><span class="bar" style="width:${Math.round(r.total/mx*100)}%"></span> ${r.total}</td><td>${r.accepted}</td><td>${r.dismissed}</td><td>${r.open}</td><td class="mut">${Object.entries(r.channels).map(([k,v])=>esc(k)+': '+v.accepted+' / '+v.dismissed).join('<br>')||'-'}</td></tr>`).join('')||'<tr><td colspan=7 class="mut">No findings yet.</td></tr>'}</table></div>
 <div class="row"><div class="card"><h3>Findings per day</h3>${d.trend.map(t=>`<div class="mut">${esc(t.day)} <span class="bar" style="width:${Math.round(t.n/tmax*70)+3}%"></span> ${t.n}</div>`).join('')||'<p class="mut">No data yet.</p>'}</div>
 <div class="card"><h3>Findings by channel</h3><table>${d.by_channel.map(c=>`<tr><td>${esc(c.channel)}</td><td>${c.n}</td></tr>`).join('')}</table><h3 style="margin-top:12px">Repeat issues by author</h3><table>${d.repeat.map(r=>`<tr><td>${esc(r.author)}</td><td>${esc(r.ref)}</td><td>${r.submissions} pieces</td></tr>`).join('')||'<tr><td class="mut">None yet.</td></tr>'}</table></div>
 <div class="card"><h3>By category</h3><table>${d.categories.map(c=>`<tr><td>${esc(c.category)}</td><td>${c.n}</td></tr>`).join('')}</table><h3 style="margin-top:12px">Content by status</h3><table>${d.statuses.map(c=>`<tr><td>${esc(c.status)}</td><td>${c.n}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Guideline change history</h3><table>${d.history.map(h=>`<tr><td class="mut" style="width:130px">${esc(h.created_at)}</td><td><b>${esc(h.ref)}</b> changed by ${esc(h.by||'?')}<div class="mut">${esc(h.reason)}</div><div class="mut">Was: ${esc(h.old_text)}<br>Now: ${esc(h.new_text)}</div></td></tr>`).join('')||'<tr><td class="mut">No guideline has been changed yet.</td></tr>'}</table></div>`}
const pc=v=>v==null?'-':Math.round(v*100)+'%';
async function viewQuality(el){el.innerHTML='<div class="spin">Running the evaluation...</div>';const q=await api('/quality');const m=q.eval.main,s=q.eval.stress,can=S.user.role!=='creator';
 el.innerHTML=`<div id="toast"></div><div class="card"><h2>Quality and reliability</h2><p>Every rule is measured on labelled test content, and the confidence you see on each finding is calibrated from those results and from what people in your workspace actually accept or dismiss.</p>
 <div class="row"><div class="box"><b>Main test set</b><br>${m.cases} cases (${m.text_cases} text, ${m.image_cases} images)<br>Precision ${pc(m.overall.precision)} &middot; Recall ${pc(m.overall.recall)}</div><div class="box"><b>Stress set (hard cases)</b><br>${s.cases} adversarial cases<br>Precision ${pc(s.overall.precision)} &middot; Recall ${pc(s.overall.recall)}</div>
 <div class="box"><b>Settings</b><br>Storage: ${esc(q.settings.database)}<br>AI layer: ${q.settings.ai_enabled?'on ('+esc(q.settings.model)+')':'off'}<br>Redaction before AI: ${q.settings.redaction?'on':'off'}</div></div>
 <p class="mut">These test sets were written by the development team, so the numbers show consistency and known limits, not performance on your own content. ${can?'<button class="alt sm" onclick="rerunEval(this)">Re-run evaluation</button>':''}</p></div>
 <div class="card"><h3>Per-rule results and calibrated confidence</h3><table><tr><th>Rule</th><th>Precision</th><th>Recall</th><th>F1</th><th>Cases</th><th>Accepted by people</th><th>Dismissed by people</th><th>Shown confidence</th></tr>${q.table.map(r=>`<tr><td><b>${esc(r.rule)}</b></td><td>${pc(r.precision)}</td><td>${pc(r.recall)}</td><td>${pc(r.f1)}</td><td>${r.support}</td><td>${r.live_accepted}</td><td>${r.live_dismissed}</td><td>${pc(r.calibrated)}</td></tr>`).join('')}</table>
 <p class="mut">Shown confidence = (evaluation precision &times; 6 + accepted) / (6 + accepted + dismissed). With few decisions it follows the test results; as people accept or dismiss findings it moves towards what they actually do.</p></div>
 <div class="card"><h3>Known misses and false alarms (stress set)</h3><table><tr><th>Case</th><th>Text</th><th>Missed</th><th>False alarm</th></tr>${s.failures.map(f=>`<tr><td>${esc(f.id)}</td><td>${esc(f.text)}</td><td>${esc(f.missed.join(', '))||'-'}</td><td>${esc(f.extra.join(', '))||'-'}</td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div>`}
async function rerunEval(b){return busy(b,async()=>{await api('/quality/run',{method:'POST'});await render();toast('Evaluation re-run')})}
boot();
</script></body></html>
